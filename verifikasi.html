<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifikasi Kartu Anggota | MWCNU Pondok Aren</title><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g1:#0F3B2C;--g2:#2F6B4F;--gold:#E4761B;--neo:#2BD9A0}
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;font-family:'Inter',system-ui,sans-serif;color:#17352A;background:radial-gradient(600px 360px at 10% 0,rgba(43,217,160,.25),transparent 70%),radial-gradient(520px 320px at 100% 100%,rgba(228,118,27,.2),transparent 70%),#FAF9F5}
main{width:100%;max-width:460px;background:#fff;border-radius:28px;padding:32px 28px;box-shadow:0 30px 60px -30px rgba(15,59,44,.5);border:1px solid #E3E7E1}
.k{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:999px;background:rgba(43,217,160,.14);color:var(--g2);font:700 .72rem 'Plus Jakarta Sans',sans-serif;letter-spacing:.14em;text-transform:uppercase}
h1{font:700 1.6rem/1.2 'Plus Jakarta Sans',sans-serif;letter-spacing:-.03em;margin:14px 0 6px}p{line-height:1.65;margin:8px 0;color:#4A5F55;font-size:.95rem}
.n{margin:18px 0;padding:16px;border-radius:18px;background:#F3F6F2;text-align:center;font:700 1.2rem 'Plus Jakarta Sans',sans-serif;letter-spacing:.04em;word-break:break-all}
.s{padding:14px 16px;border-radius:16px;font-weight:700;line-height:1.5;font-size:.92rem}.ok{background:rgba(43,217,160,.14);color:#0F6B4A}.bad{background:rgba(217,83,79,.12);color:#A93A36}.wait{background:rgba(255,201,74,.16);color:#8A6400}
a{color:var(--gold);font-weight:700}small{color:#6B7F75}
</style></head><body><main>
<span class="k">Verifikasi KTA</span><h1>Kartu Anggota MWCNU Pondok Aren</h1>
<div class="n" id="n">Memeriksa…</div><div class="s" id="s">Memeriksa data di basis data…</div>
<p id="t"></p>
<p><small>Pencocokan dilakukan ke data anggota MWCNU Pondok Aren. Jika nomor belum terdaftar, hubungi sekretariat.</small></p>
<p><a href="/">&larr; Kembali ke situs MWCNU Pondok Aren</a></p></main>
<script src="/js/config.js"></script>
<script>
(function(){
var raw='';
try{raw=decodeURIComponent((location.pathname.split('/v/')[1]||'')).trim().toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,40)}catch(e){raw=(location.pathname.split('/v/')[1]||'').replace(/%[0-9a-fA-F]{2}/g,'').replace(/[^A-Z0-9-]/g,'').trim().toUpperCase().slice(0,40)}
var n=document.getElementById('n'),s=document.getElementById('s'),t=document.getElementById('t');
n.textContent=raw||'(nomor tidak ditemukan)';
function cd(x){x=x.replace(/\D/g,'');var tt=0;for(var i=0;i<x.length;i++)tt+=(+x[x.length-1-i])*(i%2?3:1);return(10-tt%10)%10}
var m=/^MWC-(\d{2})-(\d{2})-(\d{6})-(\d)$/.exec(raw);
if(!m){s.className='s bad';s.textContent='Format nomor induk tidak dikenali.';t.textContent='Pastikan QR dipindai dari kartu anggota MWCNU Pondok Aren yang asli.';return}
if(cd(m[1]+m[2]+m[3])!==+m[4]){s.className='s bad';s.textContent='Angka cek tidak cocok. Nomor ini kemungkinan salah ketik atau tidak asli.';return}
var C=window.MWC_CFG||{};
if(!C.supabaseUrl||!C.supabaseKey){s.className='s wait';s.textContent='Format nomor cocok, tetapi layanan verifikasi belum tersedia.';t.textContent='Hubungi sekretariat untuk pemeriksaan manual.';return}
function down(){s.className='s wait';s.textContent='Layanan verifikasi tidak dapat dijangkau. Coba lagi.';t.textContent='Ini bukan berarti kartu tidak asli. Periksa koneksi, lalu muat ulang halaman ini.'}
function who(row){return row.nama?(' — '+row.nama):''}
function where(row){return row.wilayah?(' Wilayah: '+row.wilayah+'.'):''}
fetch(C.supabaseUrl+'/rest/v1/rpc/verify_nia',{method:'POST',cache:'no-store',headers:{apikey:C.supabaseKey,'Content-Type':'application/json'},body:JSON.stringify({p_nia:raw})})
.then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})
.then(function(a){var row=a&&a[0];
  /* Server hanya membalas kartu yang sudah TERVERIFIKASI. Nomor yang belum
     terverifikasi, ditolak, atau tidak terdaftar diperlakukan sama — agar
     pihak luar tidak bisa memetakan nomor anggota lewat halaman ini. */
  if(!row){s.className='s bad';s.textContent='Nomor tidak dapat diverifikasi.';t.textContent='Kartu ini belum sah sebagai bukti keanggotaan yang aktif. Hubungi sekretariat MWCNU Pondok Aren untuk pemeriksaan.';return}
  s.className='s ok';s.textContent='Kartu VALID'+who(row);t.textContent='Nomor '+raw+' terdaftar aktif sebagai anggota MWCNU Pondok Aren.'+where(row)
}).catch(down);
})();
</script></body></html>
